<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NumCheck — Strip the Narrative</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #232734;
      --border: #2d3142; --text: #e4e6eb; --text-dim: #9a9fad;
      --accent: #4ade80; --accent-dim: #22c55e; --warn: #fbbf24; --danger: #f87171;
      --primary-tag: #4ade80; --factcheck-tag: #fbbf24; --web-tag: #60a5fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
      max-width: 700px; margin: 0 auto; padding: 16px; min-height: 100vh;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #0f1117; flex-shrink: 0; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .subtitle { font-size: 12px; color: var(--text-dim); }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 14px; font-weight: 500; }
    .tab.active { background: var(--surface2); color: var(--accent); border-color: var(--accent); }
    .input-area { margin-bottom: 16px; }
    .input-area textarea { width: 100%; min-height: 120px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; resize: vertical; }
    .input-area textarea:focus { outline: none; border-color: var(--accent); }
    .input-area input { width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
    .input-area input:focus { outline: none; border-color: var(--accent); }
    .scan-btn { width: 100%; padding: 14px; background: var(--accent); color: #0f1117; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; }
    .scan-btn:hover { background: var(--accent-dim); }
    .scan-btn:disabled { opacity: 0.5; cursor: wait; }
    .status { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .claim-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .claim-text { font-size: 14px; color: var(--text); margin-bottom: 10px; line-height: 1.6; }
    .claim-text .num { background: rgba(74, 222, 128, 0.15); color: var(--accent); padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .source-group { margin-top: 12px; }
    .source-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .tag.primary { background: var(--primary-tag); }
    .tag.factcheck { background: var(--factcheck-tag); }
    .tag.web { background: var(--web-tag); }
    .source-item { padding: 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .source-item a { color: var(--text); text-decoration: none; font-weight: 600; display: block; margin-bottom: 4px; }
    .source-item a:hover { color: var(--accent); }
    .source-item .snippet { color: var(--text-dim); font-size: 12px; line-height: 1.5; }
    .source-item .domain { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
    .source-item .domain a { display: inline; color: var(--text-dim); font-weight: 400; }
    .empty-state { text-align: center; color: var(--text-dim); padding: 50px 20px; font-size: 15px; }
    .helper { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">N</div>
    <div>
      <h1>NumCheck</h1>
      <div class="subtitle">Strip the narrative. See the numbers.</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabPaste" onclick="switchTab('paste')">Paste Article Text</div>
    <div class="tab" id="tabUrl" onclick="switchTab('url')">Article URL</div>
    <div class="tab" id="tabClaim" onclick="switchTab('claim')">Verify a Claim</div>
  </div>

  <!-- Paste text tab -->
  <div class="tab-content active" id="contentPaste">
    <div class="helper">Paste the full article text below, then hit Scan.</div>
    <div class="input-area">
      <textarea id="pasteInput" placeholder="Paste the article text here..."></textarea>
    </div>
    <button class="scan-btn" id="scanPasteBtn" onclick="analyzePaste()">Scan Article</button>
  </div>

  <!-- URL tab -->
  <div class="tab-content" id="contentUrl">
    <div class="helper">Paste a link to a news article. NumCheck will fetch and analyze it.</div>
    <div class="input-area">
      <input type="text" id="urlInput" placeholder="https://example.com/news-article" />
    </div>
    <button class="scan-btn" id="scanUrlBtn" onclick="analyzeUrl()">Fetch & Scan</button>
  </div>

  <!-- Claim tab -->
  <div class="tab-content" id="contentClaim">
    <div class="helper">Type a specific claim or statistic to verify.</div>
    <div class="input-area">
      <input type="text" id="claimInput" placeholder="e.g. India GDP grew by 8.4 percent" />
    </div>
    <button class="scan-btn" id="verifyBtn" onclick="verifyClaim()">Verify Claim</button>
  </div>

  <div class="status" id="status"></div>
  <div id="results"></div>

  <script>
    var API = window.location.origin;
    var elStatus = document.getElementById("status");
    var elResults = document.getElementById("results");

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
      if (tab === "paste") { document.getElementById("tabPaste").classList.add("active"); document.getElementById("contentPaste").classList.add("active"); }
      if (tab === "url") { document.getElementById("tabUrl").classList.add("active"); document.getElementById("contentUrl").classList.add("active"); }
      if (tab === "claim") { document.getElementById("tabClaim").classList.add("active"); document.getElementById("contentClaim").classList.add("active"); }
    }

    function setStatus(html) { elStatus.innerHTML = html; }
    function escapeHtml(str) { var d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
    function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } }

    function highlightNumbers(text) {
      return escapeHtml(text).replace(
        /(\d[\d,]*(?:\.\d+)?\s?(?:percent|%|crore|lakh|billion|million|trillion|thousand|bn|mn|k|cr)?|₹\s?[\d,]+(?:\.\d+)?(?:\s?(?:crore|lakh|billion|million))?)/gi,
        '<span class="num">$1</span>'
      );
    }

    function renderResults(data) {
      if (data.claim && data.results) {
        renderSingleClaim(data.claim, [], data.results);
        return;
      }
      if (data.claims && Array.isArray(data.claims)) {
        if (data.claims.length === 0) {
          elResults.innerHTML = '<div class="empty-state">No numerical claims found in this text.</div>';
          return;
        }
        elResults.innerHTML = '<div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">Found ' + data.totalClaimsFound + ' claims. Verified ' + data.claimsVerified + '.</div>';
        data.claims.forEach(function(c) { renderSingleClaim(c.claim, c.numbers, c.results); });
      }
    }

    function renderSingleClaim(claimText, numbers, results) {
      var card = document.createElement("div");
      card.className = "claim-card";
      var html = '<div class="claim-text">' + highlightNumbers(claimText || "") + '</div>';
      var sourcesHtml = "";

      if (results && Array.isArray(results)) {
        for (var i = 0; i < results.length; i++) {
          var group = results[i];
          if (!group.items || group.items.length === 0) continue;
          var itemsHtml = group.items.map(function(item) {
            return '<div class="source-item">' +
              '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(item.title || "Untitled") + '</a>' +
              '<div class="snippet">' + escapeHtml((item.snippet || "").slice(0, 250)) + '</div>' +
              '<div class="domain"><a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' + escapeHtml(getDomain(item.url)) + '</a></div>' +
            '</div>';
          }).join("");
          sourcesHtml += '<div class="source-group">' +
            '<div class="source-group-label"><span class="tag ' + escapeHtml(group.type) + '"></span>' + escapeHtml(group.label || group.type) + '</div>' +
            itemsHtml + '</div>';
        }
      }
      if (!sourcesHtml) sourcesHtml = '<div style="font-size:13px;color:var(--text-dim);padding:10px 0;">No sources found for this claim.</div>';

      card.innerHTML = html + sourcesHtml;
      elResults.appendChild(card);
    }

    async function analyzePaste() {
      var text = document.getElementById("pasteInput").value.trim();
      if (!text || text.length < 20) { setStatus("⚠ Please paste more text."); return; }
      elResults.innerHTML = "";
      var btn = document.getElementById("scanPasteBtn");
      btn.disabled = true;
      setStatus('<span class="spinner"></span>Extracting claims and searching for primary sources...');
      try {
        var res = await fetch(API + "/api/analyze", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        if (!res.ok) { var e = await res.json().catch(function() { return {}; }); setStatus("⚠ Error: " + (e.error || res.statusText)); return; }
        var data = await res.json();
        setStatus("✓ Found " + data.totalClaimsFound + " claims, verified " + data.claimsVerified + ".");
        renderResults(data);
      } catch (err) { setStatus("⚠ " + err.message); }
      btn.disabled = false;
    }

    async function analyzeUrl() {
      var url = document.getElementById("urlInput").value.trim();
      if (!url) { setStatus("⚠ Please paste a URL."); return; }
      elResults.innerHTML = "";
      var btn = document.getElementById("scanUrlBtn");
      btn.disabled = true;
      setStatus('<span class="spinner"></span>Fetching article and extracting claims...');
      try {
        var res = await fetch(API + "/api/analyze-url", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });
        if (!res.ok) { var e = await res.json().catch(function() { return {}; }); setStatus("⚠ Error: " + (e.error || res.statusText)); return; }
        var data = await res.json();
        setStatus("✓ Found " + data.totalClaimsFound + " claims, verified " + data.claimsVerified + ".");
        renderResults(data);
      } catch (err) { setStatus("⚠ " + err.message); }
      btn.disabled = false;
    }

    async function verifyClaim() {
      var claim = document.getElementById("claimInput").value.trim();
      if (!claim) { setStatus("⚠ Please type a claim."); return; }
      elResults.innerHTML = "";
      var btn = document.getElementById("verifyBtn");
      btn.disabled = true;
      setStatus('<span class="spinner"></span>Searching for primary sources...');
      try {
        var res = await fetch(API + "/api/verify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ claim: claim })
        });
        if (!res.ok) { var e = await res.json().catch(function() { return {}; }); setStatus("⚠ Error: " + (e.error || res.statusText)); return; }
        var data = await res.json();
        setStatus("✓ Found " + data.count + " sources via " + data.provider + ".");
        renderResults(data);
      } catch (err) { setStatus("⚠ " + err.message); }
      btn.disabled = false;
    }
  </script>
</body>
</html>
