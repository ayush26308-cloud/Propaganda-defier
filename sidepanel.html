<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NumCheck</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #232734;
      --border: #2d3142; --text: #e4e6eb; --text-dim: #9a9fad;
      --accent: #4ade80; --accent-dim: #22c55e; --warn: #fbbf24; --danger: #f87171;
      --primary-tag: #4ade80; --factcheck-tag: #fbbf24; --web-tag: #60a5fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
      width: 100%; min-width: 320px; padding: 14px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #0f1117; flex-shrink: 0; }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header .subtitle { font-size: 10px; color: var(--text-dim); }

    .scan-btn {
      width: 100%; padding: 11px; background: var(--accent); color: #0f1117;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-bottom: 10px; transition: background 0.2s;
    }
    .scan-btn:hover { background: var(--accent-dim); }
    .scan-btn:disabled { opacity: 0.4; cursor: wait; }

    .manual-verify { display: flex; gap: 6px; margin-bottom: 12px; }
    .manual-verify input {
      flex: 1; padding: 8px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px;
    }
    .manual-verify input:focus { outline: none; border-color: var(--accent); }
    .manual-verify button {
      padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); cursor: pointer; font-size: 13px;
    }
    .manual-verify button:hover { border-color: var(--accent); }

    .status { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; min-height: 16px; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .page-info {
      font-size: 11px; color: var(--text-dim); background: var(--surface);
      border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; display: none;
    }
    .page-info .ptype { display: inline-block; padding: 1px 6px; border-radius: 3px; font-weight: 600; font-size: 10px; }
    .page-info .ptype.youtube { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .page-info .ptype.x { background: rgba(96, 165, 250, 0.2); color: var(--web-tag); }
    .page-info .ptype.instagram { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .page-info .ptype.article { background: rgba(74, 222, 128, 0.15); color: var(--accent); }

    .claim-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 10px;
    }
    .claim-text { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
    .claim-text .num {
      background: rgba(74, 222, 128, 0.15); color: var(--accent);
      padding: 1px 4px; border-radius: 3px; font-weight: 600;
    }

    .source-group { margin-top: 8px; }
    .source-group-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 5px; display: flex; align-items: center; gap: 4px;
    }
    .tag { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
    .tag.primary { background: var(--primary-tag); }
    .tag.factcheck { background: var(--factcheck-tag); }
    .tag.web { background: var(--web-tag); }

    .source-item {
      padding: 7px 9px; background: var(--surface2); border-radius: 6px;
      margin-bottom: 5px; font-size: 12px;
    }
    .source-item a { color: var(--text); text-decoration: none; font-weight: 500; display: block; margin-bottom: 2px; }
    .source-item a:hover { color: var(--accent); }
    .source-item .snippet { color: var(--text-dim); font-size: 11px; line-height: 1.4; }
    .source-item .domain { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
    .source-item .domain a { display: inline; color: var(--text-dim); font-weight: 400; }

    .empty-state { text-align: center; color: var(--text-dim); padding: 30px 16px; font-size: 13px; }

    .footer {
      margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
      text-align: center; font-size: 10px; color: var(--text-dim);
    }
    .footer a { color: var(--text-dim); text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">N</div>
    <div>
      <h1>NumCheck</h1>
      <div class="subtitle">Strip the narrative. See the numbers.</div>
    </div>
  </div>

  <button class="scan-btn" id="scanBtn">Scan This Page</button>

  <div class="manual-verify">
    <input type="text" id="manualInput" placeholder="Or type a claim to verify..." />
    <button id="manualBtn">Verify</button>
  </div>

  <div class="status" id="status"></div>
  <div class="page-info" id="pageInfo"></div>
  <div id="results"></div>

  <div class="footer">
    100% local. No server. No ads. No tracking.<br/>
    <a href="https://github.com/ayush26308-cloud/Propaganda-defier" target="_blank">Open Source</a>
  </div>

  <script src="lib/sources.js"></script>
  <script src="lib/extractor.js"></script>
  <script src="lib/search.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
