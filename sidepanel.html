<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NumCheck</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232734;
      --border: #2d3142;
      --text: #e4e6eb;
      --text-dim: #9a9fad;
      --accent: #4ade80;
      --accent-dim: #22c55e;
      --warn: #fbbf24;
      --danger: #f87171;
      --primary-tag: #4ade80;
      --factcheck-tag: #fbbf24;
      --web-tag: #60a5fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #0f1117;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .subtitle { font-size: 11px; color: var(--text-dim); }
    .scan-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #0f1117;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
    }
    .scan-btn:hover { background: var(--accent-dim); }
    .scan-btn:disabled { opacity: 0.5; cursor: wait; }

    .manual-verify {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .manual-verify input {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }
    .manual-verify button {
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    .manual-verify button:hover { border-color: var(--accent); }

    .status { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .page-info {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 16px;
    }

    .claim-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .claim-text {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .claim-text .num {
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    .source-group { margin-top: 10px; }
    .source-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .tag.primary { background: var(--primary-tag); }
    .tag.factcheck { background: var(--factcheck-tag); }
    .tag.web { background: var(--web-tag); }

    .source-item {
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .source-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      display: block;
      margin-bottom: 2px;
    }
    .source-item a:hover { color: var(--accent); }
    .source-item .snippet {
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1.4;
    }
    .source-item .domain {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .source-item .domain a {
      display: inline;
      color: var(--text-dim);
      font-weight: 400;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 20px;
      font-size: 13px;
    }
    .settings-link {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .settings-link a {
      color: var(--text-dim);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .settings-link a:hover { color: var(--accent); }

    .settings-panel {
      display: none;
      background: var(--surface);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }
    .settings-panel.open { display: block; }
    .settings-panel label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      margin-top: 8px;
    }
    .settings-panel input {
      width: 100%;
      padding: 6px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
    }
    .settings-panel .save-btn {
      margin-top: 10px;
      padding: 6px 12px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #0f1117;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">N</div>
    <div>
      <h1>NumCheck</h1>
      <div class="subtitle">Strip the narrative. See the numbers.</div>
    </div>
  </div>

  <button class="scan-btn" id="scanBtn">Scan This Page</button>

  <div class="manual-verify">
    <input type="text" id="manualInput" placeholder="Or paste a claim to verify..." />
    <button id="manualBtn">Verify</button>
  </div>

  <div class="status" id="status"></div>
  <div class="page-info" id="pageInfo" style="display:none;"></div>
  <div id="results"></div>

  <div class="settings-link">
    <a id="settingsToggle">⚙ Server settings</a>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <label>Backend URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:4567" />
    <button class="save-btn" id="saveSettings">Save</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
